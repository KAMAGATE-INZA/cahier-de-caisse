<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cahier de Caisse</title>
<meta name="theme-color" content="#0d6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Carnet de caisse mobile : bilan par période en tête, cinq onglets, bouton d'ajout flottant. Polices système pour marcher hors connexion. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#dbe2dd;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --gold:#a86a00; --gold-soft:#fbefd4; --red:#b3392f; --red-soft:#f8e1de;
  --violet:#5b4bb7; --violet-soft:#e8e5f7;
  --gain-bg:#0d6b57; --gain-ink:#ffffff; --loss-bg:#b3392f; --loss-ink:#ffffff; --zero-bg:#5d6b66; --zero-ink:#ffffff;
  --bar:#0d6b57; --bar-hi:#0a4f41; --grid:#e4e9e5;
  --display:ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1513; --surface:#18211e; --ink:#e6eeea; --muted:#9aaba4; --line:#2a3632;
  --accent:#3fbf9f; --accent-ink:#06231c; --accent-soft:#163a31;
  --gold:#f0b54a; --gold-soft:#3a2c10; --red:#ef8a7f; --red-soft:#3d1c18;
  --violet:#a99cf0; --violet-soft:#26213f;
  --gain-bg:#14765f; --gain-ink:#ffffff; --loss-bg:#a5352c; --loss-ink:#ffffff; --zero-bg:#2a3632; --zero-ink:#e6eeea;
  --bar:#3fbf9f; --bar-hi:#7fdcc4; --grid:#24302c; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding-block:18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.01em;min-width:0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;padding-block:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.banner{padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.red{background:var(--red-soft)}
section{padding-top:16px;display:grid;gap:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.hero{background:var(--gain-bg);color:var(--gain-ink);border-radius:18px;padding:18px}
.hero.perte{background:var(--loss-bg);color:var(--loss-ink)}
.hero.zero{background:var(--zero-bg);color:var(--zero-ink)}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin-top:4px}
.hero .verdict{font-family:var(--display);font-weight:700;font-size:19px;margin-top:6px;text-wrap:balance}
.hero .explique{font-size:14px;opacity:.9;margin-top:2px}
.ledger{margin-top:14px;display:grid;gap:6px;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger .tot{border-top:1px solid currentColor;padding-top:6px;font-weight:700}
.ledger div:not(.tot){opacity:.9}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.chip .v{font-weight:700;font-size:20px;margin-top:2px}
.chip.gold{background:var(--gold-soft);border-color:transparent}
.chip.gold .v{color:var(--gold)}

.prod .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prod h3{font-size:18px;font-weight:600;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.violet{background:var(--violet-soft);color:var(--violet)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.kv b{display:block;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.rank{font-size:12px;font-weight:700;color:var(--muted)}

.chart svg{display:block;width:100%;height:auto;touch-action:manipulation}
.chart .tip{font-size:14px;min-height:21px}
.chart .tip b{font-weight:700}

.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:right}
.row .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}
.mini.danger{color:var(--red)}
.mini.wa{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.mini.armed{background:var(--red);color:var(--surface);border-color:var(--red)}
.paid{border:0;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.paid.yes{background:var(--accent-soft);color:var(--accent)}
.paid.no{background:var(--gold-soft);color:var(--gold)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.dayhead{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-size:16px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;
  border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:15px 22px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
.sheet form,.sheet .inner{max-width:600px;margin:0 auto;display:grid;gap:12px}
.sheet h2{font-size:22px}
.sheet h3{font-size:16px;margin-top:6px}
.sheet p{margin:0}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);border:1px solid var(--line)}
.btn.warn{background:var(--red);color:var(--surface)}
.err{color:var(--red);font-size:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.sep{border:0;border-top:1px solid var(--line);margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cahier de Caisse</h1>
    <button class="pill" id="btn-reglages">Réglages</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="bilan" aria-selected="true">Bilan</button>
    <button role="tab" data-tab="ventes" aria-selected="false">Ventes</button>
    <button role="tab" data-tab="clients" aria-selected="false">Clients</button>
    <button role="tab" data-tab="stock" aria-selected="false">Produits</button>
    <button role="tab" data-tab="depenses" aria-selected="false">Dépenses</button>
  </nav>
  <section id="v-bilan"></section>
  <section id="v-ventes" hidden></section>
  <section id="v-clients" hidden></section>
  <section id="v-stock" hidden></section>
  <section id="v-depenses" hidden></section>
</div>

<button class="fab" id="fab">+ Vente</button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
/* ================= Base de données locale (JSON sur l'appareil) ================= */
const KEY = "cahier-de-caisse:v1";
const PREFS = "cahier-de-caisse:prefs";
const FORMAT = 2;

function donneesInitiales() {
  return { format: FORMAT, cree: Date.now(), modifie: Date.now(), derniereSauvegarde: null,
    reglages: { boutique: "", numero: "", objectifMois: 0 }, produits: [], ventes: [], depenses: [] };
}
function valide(d) { return d && Array.isArray(d.produits) && Array.isArray(d.ventes) && Array.isArray(d.depenses); }
/* Met à niveau les données d'une ancienne version sans rien perdre */
function normaliser(d) {
  d.reglages = Object.assign({ boutique: "", numero: "", objectifMois: 0 }, d.reglages || {});
  const parId = Object.fromEntries(d.produits.map(p => [p.id, p]));
  for (const p of d.produits) { if (!p.mode) p.mode = "stock"; if (p.seuil === undefined) p.seuil = 2; if (p.commission === undefined) p.commission = 0; if (!p.plateforme) p.plateforme = "moi"; }
  for (const v of d.ventes) {
    if (v.coutU === undefined) { const p = parId[v.produitId]; v.coutU = p ? coutVente(p, v.prix) : 0; }
    if (v.tel === undefined) v.tel = "";
  }
  d.format = FORMAT;
  return d;
}
function charger() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (valide(d)) return normaliser(d); } } catch {}
  return null;
}
function enregistrer() {
  S.data.modifie = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S.data)); return true; }
  catch { toast("Impossible d'enregistrer sur cet appareil. Fais une sauvegarde."); return false; }
}
const nouvelId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const db = {
  ajouter(col, obj) { const o = { id: nouvelId(), ...obj }; S.data[col].push(o); enregistrer(); render(); return o; },
  modifier(col, id, patch) { const x = S.data[col].find(o => o.id === id); if (x) Object.assign(x, patch); enregistrer(); render(); },
  supprimer(col, id) { S.data[col] = S.data[col].filter(o => o.id !== id); enregistrer(); render(); }
};
/* Coût d'une pièce vendue : coût de revient (physique) ou commission + frais de la plateforme (numérique) */
function coutVente(p, prix) {
  if (p.mode !== "numerique") return +p.cout || 0;
  return (+p.frais || 0) + Math.round((+prix || 0) * (+p.commission || 0) / 100);
}
const estChariow = v => v.paiement === "Chariow";

/* ================= État & utilitaires ================= */
let prefs = { tab: "bilan", periode: "mois" };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS) || "{}")); } catch {}
const S = { data: charger() || donneesInitiales(), tab: prefs.tab, periode: prefs.periode, q: "", qc: "" };
function garderPrefs() { try { localStorage.setItem(PREFS, JSON.stringify({ tab: S.tab, periode: S.periode })); } catch {} }
let stockageOK = true;
try { localStorage.setItem(KEY + ":test", "1"); localStorage.removeItem(KEY + ":test"); } catch { stockageOK = false; }
if (stockageOK) enregistrer();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const $ = s => document.querySelector(s);
const fmt = new Intl.NumberFormat("fr-FR");
const N = n => fmt.format(Math.round(n || 0));
const F = n => N(n) + " F";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isoDe = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const todayISO = () => isoDe(new Date());
const dateDe = iso => new Date(iso + "T12:00:00");
const dayLabel = iso => { try { return dateDe(iso).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); } catch { return iso; } };
const joursDepuis = t => t ? Math.floor((Date.now() - t) / 86400000) : null;
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const produitDe = id => S.data.produits.find(p => p.id === id);
const nomProduit = id => (produitDe(id) || {}).nom || "Produit supprimé";
const totalVente = v => (+v.qte || 0) * (+v.prix || 0);
const beneficeVente = v => totalVente(v) - (+v.qte || 0) * (+v.coutU || 0);

/* Numéro WhatsApp : 07 07 12 34 56 → 2250707123456 (Côte d'Ivoire par défaut) */
function numeroWa(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 10 && d.startsWith("0")) d = "225" + d;
  if (d.length === 10) d = "225" + d;
  return d.length >= 11 ? d : "";
}
const lienWa = (tel, texte) => "https://wa.me/" + numeroWa(tel) + "?text=" + encodeURIComponent(texte);

/* ================= Périodes ================= */
const PERIODES = { "7j": "7 jours", "mois": "Ce mois", "mois-1": "Mois dernier", "tout": "Tout" };
function bornes(periode) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if (periode === "7j") { const d = new Date(now); d.setDate(d.getDate() - 6); return [isoDe(d), todayISO()]; }
  if (periode === "mois") return [isoDe(new Date(y, m, 1)), todayISO()];
  if (periode === "mois-1") return [isoDe(new Date(y, m - 1, 1)), isoDe(new Date(y, m, 0))];
  return ["0000-00-00", "9999-99-99"];
}
function nomPeriode(periode) {
  const now = new Date();
  if (periode === "mois") return now.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  if (periode === "mois-1") return new Date(now.getFullYear(), now.getMonth() - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  if (periode === "7j") return "7 derniers jours";
  return "depuis le début";
}
const dansPeriode = (iso, [a, b]) => iso >= a && iso <= b;

/* ================= Calculs ================= */
function stats(periode) {
  const bp = bornes(periode);
  const byProd = {};
  for (const p of S.data.produits) byProd[p.id] = { p, vendusTotal: 0, vendus: 0, ca: 0, benef: 0 };
  let ca = 0, cout = 0, aRecevoir = 0, aRecevoirChariow = 0, nbVentes = 0;
  for (const v of S.data.ventes) {
    const q = +v.qte || 0, total = totalVente(v), c = q * (+v.coutU || 0);
    const b = byProd[v.produitId];
    if (b) b.vendusTotal += q;
    if (!v.encaisse) { if (estChariow(v)) { aRecevoir += total - c; aRecevoirChariow += total - c; } else aRecevoir += total; }
    if (!dansPeriode(v.date, bp)) continue;
    ca += total; cout += c; nbVentes++;
    if (b) { b.vendus += q; b.ca += total; b.benef += total - c; }
  }
  const deps = S.data.depenses.filter(d => dansPeriode(d.date, bp));
  const dep = deps.reduce((s, d) => s + (+d.montant || 0), 0);
  let valeurStock = 0;
  for (const id in byProd) {
    const b = byProd[id];
    b.restant = b.p.mode === "numerique" ? Infinity : Math.max(0, (+b.p.quantite || 0) - b.vendusTotal);
    if (b.p.mode !== "numerique") valeurStock += b.restant * (+b.p.cout || 0);
  }
  return { bp, byProd, ca, cout, dep, nbVentes, nbDep: deps.length, net: ca - cout - dep, aRecevoir, aRecevoirChariow, valeurStock };
}

/* ================= Affichage ================= */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  for (const t of ["bilan","ventes","clients","stock","depenses"]) $("#v-" + t).hidden = t !== S.tab;
  $("#fab").textContent = S.tab === "depenses" ? "+ Dépense" : S.tab === "stock" ? "+ Produit" : "+ Vente";
  const st = stats(S.periode);
  renderBilan(st); renderVentes(); renderClients(); renderStock(stats("tout")); renderDepenses();
}

function bannerSauvegarde() {
  if (!stockageOK) return `<div class="banner red"><span>Ce navigateur bloque l'enregistrement. Ouvre l'appli en navigation normale (pas privée).</span></div>`;
  const n = S.data.ventes.length + S.data.depenses.length;
  const j = joursDepuis(S.data.derniereSauvegarde);
  if (n === 0) return "";
  if (j === null || j >= 7) return `<div class="banner"><span>${j === null ? "Tu n'as encore jamais sauvegardé tes données." : "Dernière sauvegarde il y a " + j + " jours."}</span><button class="mini" data-act="exporter">Sauvegarder</button></div>`;
  return "";
}

function renderBilan(st) {
  const el = $("#v-bilan");
  let h = `<div class="seg" role="group" aria-label="Période">${Object.entries(PERIODES).map(([k, l]) =>
    `<button data-periode="${k}" aria-pressed="${k === S.periode}">${l}</button>`).join("")}</div>`;
  h += bannerSauvegarde();

  const bas = Object.values(stats("tout").byProd).filter(b => b.p.mode === "stock" && (+b.p.quantite > 0) && b.restant <= (+b.p.seuil || 0));
  if (bas.length) h += `<div class="banner red"><span><b>Stock bas :</b> ${bas.map(b => esc(b.p.nom) + " (" + b.restant + " restant" + (b.restant > 1 ? "s" : "") + ")").join(", ")}. Pense à racheter avant d'être en rupture.</span></div>`;
  const missing = S.data.produits.filter(p => p.mode === "numerique" ? !(+p.prixVente) : (!(+p.cout) || !(+p.quantite)));
  if (missing.length) h += `<div class="banner"><span>Complète ${missing.map(p => "<b>" + esc(p.nom) + "</b>").join(", ")} dans l'onglet Produits (coût, quantité ou prix manquant). Sans ça, le bénéfice affiché est faux.</span></div>`;

  const net = Math.round(st.net), abs = F(Math.abs(net));
  const activite = st.nbVentes + st.nbDep > 0;
  let etat, signe, verdict, explique, ligne;
  if (!activite) {
    etat = "zero"; signe = ""; verdict = S.data.ventes.length ? "Aucune activité sur cette période" : "Pas encore de vente";
    explique = S.data.ventes.length ? "Choisis une autre période ou enregistre une vente." : "Enregistre ta première vente pour voir si tu gagnes ou perds de l'argent."; ligne = "= Résultat";
  } else if (net > 0) {
    etat = "gain"; signe = "+"; verdict = "Tu as gagné " + abs;
    explique = "Tes ventes couvrent le coût des produits vendus et tes dépenses, et il te reste ce bénéfice."; ligne = "= Ce que tu as gagné";
  } else if (net < 0) {
    etat = "perte"; signe = "−"; verdict = "Tu as perdu " + abs;
    explique = "Tes ventes ne couvrent pas encore le coût des produits vendus et tes dépenses. Il te manque " + abs + " pour rentrer dans tes frais."; ligne = "= Ce que tu as perdu";
  } else {
    etat = "zero"; signe = ""; verdict = "Ni gain ni perte";
    explique = "Tu as juste récupéré ce que tu as dépensé."; ligne = "= Résultat";
  }
  h += `<div class="hero ${etat === "gain" ? "" : etat}">
    <div class="label">Bénéfice net · ${esc(nomPeriode(S.periode))}</div>
    <div class="big num">${signe}${abs}</div>
    <div class="verdict">${verdict}</div>
    <div class="explique">${explique}</div>
    <div class="ledger num">
      <div><span>Ventes (${st.nbVentes})</span><span>${F(st.ca)}</span></div>
      <div><span>− Coût des produits vendus</span><span>${F(st.cout)}</span></div>
      <div><span>− Dépenses</span><span>${F(st.dep)}</span></div>
      <div class="tot"><span>${ligne}</span><span>${signe}${abs}</span></div>
    </div></div>`;

  const obj = +S.data.reglages.objectifMois || 0;
  if (S.periode === "mois") {
    if (obj > 0) {
      const pct = Math.max(0, Math.min(100, net / obj * 100));
      const reste = Math.max(0, obj - net);
      const now = new Date(), fin = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), joursRestants = fin - now.getDate();
      h += `<div class="card"><div class="head"><span class="label">Objectif du mois</span><span class="num"><b>${F(obj)}</b></span></div>
        <div class="bar" role="img" aria-label="${Math.round(pct)} % de l'objectif"><i style="width:${pct}%"></i></div>
        <div class="note num">${reste === 0 ? "Objectif atteint, bravo. Tu peux viser plus haut dans les Réglages." :
          Math.round(pct) + " % atteint. Il te reste " + F(reste) + " de bénéfice à faire" + (joursRestants > 0 ? " en " + joursRestants + " jour" + (joursRestants > 1 ? "s" : "") : " aujourd'hui") + "."}</div></div>`;
    } else {
      h += `<button class="banner" data-act="reglages" style="border:0;text-align:left;width:100%"><span>Fixe-toi un <b>objectif de bénéfice pour le mois</b> : l'appli te montrera ta progression.</span><span class="mini">Fixer</span></button>`;
    }
  }

  h += `<div class="chips">
      <div class="chip gold"><div class="label">À recevoir</div><div class="v num">${F(st.aRecevoir)}</div>${st.aRecevoirChariow ? `<div class="note num">dont ${F(st.aRecevoirChariow)} de Chariow</div>` : ""}</div>
      <div class="chip"><div class="label">Valeur du stock</div><div class="v num">${F(st.valeurStock)}</div></div>
    </div>`;

  if (st.nbVentes) h += graphique(st.bp);

  h += `<div class="label">Par produit, du plus rentable au moins rentable</div>`;
  if (!S.data.produits.length) h += `<div class="empty"><b>Aucun produit</b>Ajoute ton premier produit dans l'onglet Produits.</div>`;
  const liste = Object.values(st.byProd).sort((a, b) => b.benef - a.benef || b.vendus - a.vendus);
  liste.forEach((b, i) => {
    const p = b.p, num = p.mode === "numerique", depot = p.mode === "depot";
    const q = +p.quantite || 0, pct = !num && q ? Math.min(100, b.vendusTotal / q * 100) : 0;
    const prixRef = depot ? (+p.reverse || 0) : (+p.prixVente || 0);
    const margeU = b.vendus ? b.benef / b.vendus : prixRef - coutVente(p, prixRef);
    const tag = num ? `<span class="tag violet">Numérique</span>` : depot ? `<span class="tag gold">En dépôt</span>` : `<span class="tag">En stock</span>`;
    h += `<div class="card prod">
      <div class="top"><div><div class="rank">#${i + 1}</div><h3>${esc(p.nom)}</h3></div>${tag}</div>
      ${num ? "" : `<div class="bar" role="img" aria-label="${b.vendusTotal} vendus sur ${q} au total"><i style="width:${pct}%"></i></div>`}
      <div class="kv num">
        <div><span class="note">Vendus</span><b>${b.vendus}</b></div>
        <div><span class="note">${num ? "Stock" : depot ? "Chez le vendeur" : "Restants"}</span><b>${num ? "Illimité" : q ? b.restant : "?"}</b></div>
        <div><span class="note">Bénéfice</span><b>${F(b.benef)}</b></div>
      </div>
      <div class="note num">Marge par pièce : ${(num || +p.cout || b.vendus) ? F(margeU) : "?"}${p.note ? " · " + esc(p.note) : ""}</div>
    </div>`;
  });
  el.innerHTML = h;
}

/* Graphique des ventes : une barre par jour (ou par mois sur « Tout ») */
function graphique([a, b]) {
  let buckets = [];
  const ventes = S.data.ventes.filter(v => dansPeriode(v.date, [a, b]));
  if (S.periode === "tout") {
    const premier = ventes.reduce((m, v) => v.date < m ? v.date : m, todayISO()).slice(0, 7);
    const now = new Date(); let d = new Date(now.getFullYear(), now.getMonth(), 1);
    while (isoDe(d).slice(0, 7) >= premier && buckets.length < 12) {
      const k = isoDe(d).slice(0, 7);
      buckets.unshift({ k, court: d.toLocaleDateString("fr-FR", { month: "short" }), long: d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }) });
      d = new Date(d.getFullYear(), d.getMonth() - 1, 1);
    }
  } else {
    const d = dateDe(a), fin = dateDe(b);
    while (d <= fin) { const k = isoDe(d); buckets.push({ k, court: String(d.getDate()), long: dayLabel(k) }); d.setDate(d.getDate() + 1); }
  }
  const mois = S.periode === "tout";
  for (const bk of buckets) { bk.ca = 0; bk.n = 0; }
  const idx = Object.fromEntries(buckets.map((bk, i) => [bk.k, i]));
  for (const v of ventes) { const i = idx[mois ? v.date.slice(0, 7) : v.date]; if (i !== undefined) { buckets[i].ca += totalVente(v); buckets[i].n++; } }
  const max = Math.max(...buckets.map(x => x.ca), 1);
  const pas = Math.pow(10, Math.floor(Math.log10(max))), haut = Math.ceil(max / pas) * pas;
  const W = 360, H = 150, pt = 16, pb = 22, ph = H - pt - pb, n = buckets.length;
  const slot = W / n, bw = Math.max(1, Math.min(28, slot - 2));
  let bars = "", hits = "", labels = "";
  const etiq = new Set([0, n - 1, Math.floor((n - 1) / 2)]);
  buckets.forEach((bk, i) => {
    const x = i * slot + (slot - bw) / 2, hgt = bk.ca ? Math.max(3, bk.ca / haut * ph) : 0, y = pt + ph - hgt, r = Math.min(4, bw / 2, hgt);
    if (hgt) bars += `<path d="M${x},${pt + ph} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${pt + ph} Z" fill="var(--bar)" data-i="${i}"/>`;
    hits += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-i="${i}"/>`;
    if (etiq.has(i) || n <= 12) labels += `<text x="${i === 0 ? i * slot + (slot - bw) / 2 : i === n - 1 ? i * slot + (slot + bw) / 2 : i * slot + slot / 2}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${esc(bk.court)}</text>`;
  });
  window._buckets = buckets;
  const total = buckets.reduce((s, x) => s + x.ca, 0);
  return `<div class="card chart">
    <div class="head"><span class="label">Ventes ${mois ? "par mois" : "par jour"}</span><span class="note num">Total ${F(total)}</span></div>
    <div class="tip num" id="chart-tip">Touche une barre pour voir le détail.</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventes ${mois ? "par mois" : "par jour"}, total ${F(total)}">
      <line x1="0" x2="${W}" y1="${pt}" y2="${pt}" stroke="var(--grid)" stroke-width="1"/>
      <text x="0" y="${pt - 3}" font-size="11" fill="var(--muted)">${N(haut)} F</text>
      <line x1="0" x2="${W}" y1="${pt + ph}" y2="${pt + ph}" stroke="var(--line)" stroke-width="1"/>
      ${bars}${labels}<g id="chart-hits">${hits}</g>
    </svg></div>`;
}
function montrerBarre(i) {
  const bk = (window._buckets || [])[i]; if (!bk) return;
  $("#chart-tip").innerHTML = `<b>${esc(bk.long)}</b> : ${bk.n ? F(bk.ca) + " · " + bk.n + " vente" + (bk.n > 1 ? "s" : "") : "aucune vente"}`;
  document.querySelectorAll(".chart path[data-i]").forEach(p => p.setAttribute("fill", p.dataset.i == i ? "var(--bar-hi)" : "var(--bar)"));
}
document.addEventListener("pointerover", e => { const r = e.target.closest && e.target.closest("#chart-hits rect"); if (r) montrerBarre(+r.dataset.i); });
document.addEventListener("click", e => { const r = e.target.closest && e.target.closest("#chart-hits rect"); if (r) montrerBarre(+r.dataset.i); });

function texteRecu(v) {
  const p = produitDe(v.produitId) || {}, r = S.data.reglages;
  let t = `Bonjour${v.client ? " " + v.client : ""}, merci pour ton achat !\n\n`;
  t += `Reçu du ${dateDe(v.date).toLocaleDateString("fr-FR")}\n${nomProduit(v.produitId)} × ${v.qte} : ${F(totalVente(v))}\n`;
  t += `Paiement : ${v.paiement || "—"}${v.encaisse ? " (payé)" : " (à régler)"}\n`;
  if (p.mode === "numerique" && p.lien) t += `\nTon lien de téléchargement : ${p.lien}\n`;
  if (!v.encaisse && r.numero) t += `\nTu peux payer par Mobile Money au ${r.numero}.\n`;
  t += `\nÀ bientôt${r.boutique ? " chez " + r.boutique : ""} !`;
  return t;
}
/* Vente Chariow : Chariow a déjà livré le fichier. On remercie et on invite à partager. */

/* ---------- Clients ---------- */
function clients() {
  const map = new Map();
  for (const v of S.data.ventes) {
    const tel = numeroWa(v.tel), nom = (v.client || "").trim();
    if (!tel && !nom) continue;
    const cle = tel || "nom:" + nom.toLowerCase();
    if (!map.has(cle)) map.set(cle, { nom, tel: v.tel || "", achats: 0, total: 0, du: 0, dernier: "", ventes: [] });
    const c = map.get(cle);
    if (nom && !c.nom) c.nom = nom;
    if (v.tel && !c.tel) c.tel = v.tel;
    c.achats++; c.total += totalVente(v); if (!v.encaisse && !estChariow(v)) c.du += totalVente(v);
    if (v.date > c.dernier) c.dernier = v.date;
    c.ventes.push(v);
  }
  return [...map.values()].sort((a, b) => b.total - a.total);
}
function renderClients() {
  const el = $("#v-clients");
  const all = clients();
  if (!all.length) { el.innerHTML = `<div class="empty"><b>Aucun client pour l'instant</b>Quand tu notes le nom ou le numéro du client dans une vente, il apparaît ici. Tu pourras le recontacter sur WhatsApp en un geste.</div>`; return; }
  const q = norm(S.qc);
  const list = all.filter(c => !q || norm(c.nom + " " + c.tel).includes(q));
  const fideles = all.filter(c => c.achats > 1).length;
  let h = `<div class="chips"><div class="chip"><div class="label">Clients</div><div class="v num">${all.length}</div></div>
    <div class="chip"><div class="label">Revenus plusieurs fois</div><div class="v num">${fideles}</div></div></div>
    <input class="search" id="q-clients" type="search" placeholder="Chercher un client…" value="${esc(S.qc)}" aria-label="Chercher un client">`;
  for (const c of list) {
    const j = Math.floor((Date.now() - dateDe(c.dernier)) / 86400000);
    const r = S.data.reglages;
    const msg = c.du > 0
      ? `Bonjour${c.nom ? " " + c.nom : ""}, petit rappel : il reste ${F(c.du)} à régler pour tes achats.` + (r.numero ? ` Tu peux payer par Wave ou Orange Money au ${r.numero}.` : "") + " Merci !"
      : `Bonjour${c.nom ? " " + c.nom : ""} ! J'espère que tu es satisfait(e) de ton achat. J'ai de nouveaux articles, tu veux que je t'envoie les photos ?`;
    h += `<div class="row">
      <div><div class="t">${esc(c.nom || c.tel)}${c.achats > 1 ? ` <span class="tag">Fidèle</span>` : ""}</div>
      <div class="m num">${c.achats} achat${c.achats > 1 ? "s" : ""} · dernier ${j <= 0 ? "aujourd'hui" : "il y a " + j + " j"}${c.nom && c.tel ? " · " + esc(c.tel) : ""}</div></div>
      <div><div class="amt num">${F(c.total)}</div>${c.du > 0 ? `<div class="m num" style="text-align:right;color:var(--gold)">doit ${F(c.du)}</div>` : ""}</div>
      ${numeroWa(c.tel) ? `<div class="acts"><a class="mini wa" href="${lienWa(c.tel, msg)}" target="_blank" rel="noopener">${c.du > 0 ? "Relancer le paiement" : "Écrire sur WhatsApp"}</a></div>` : ""}
    </div>`;
  }
  el.innerHTML = h;
}

  for (const d of list) h += `<div class="row">

function openSheet(html, onSubmit) {
  const sh = $("#sheet");
  sh.innerHTML = html; sh.hidden = false; $("#scrim").hidden = false;
  const form = sh.querySelector("form");
  if (form && onSubmit) form.addEventListener("submit", e => {
    e.preventDefault();
    try { onSubmit(new FormData(form)); closeSheet(); }
    catch (err) { form.querySelector(".err").textContent = err.message || "Vérifie les champs."; }
  });
  sh.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  return form || sh;
}
function closeSheet() { $("#sheet").hidden = true; $("#scrim").hidden = true; $("#sheet").innerHTML = ""; }
$("#scrim").addEventListener("click", closeSheet);
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

async function partagerFichier(nom, contenu, type, titre) {
  const fichier = new File([contenu], nom, { type });
  const mobile = matchMedia("(pointer: coarse)").matches;
  if (mobile && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try { await navigator.share({ files: [fichier], title: titre }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(fichier);
  const a = document.createElement("a"); a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}
async function exporter() {
  const contenu = JSON.stringify({ app: "cahier-de-caisse", exporte: new Date().toISOString(), ...S.data, derniereSauvegarde: Date.now() }, null, 2);
  if (await partagerFichier("cahier-de-caisse-" + todayISO() + ".json", contenu, "application/json", "Sauvegarde Cahier de Caisse")) {
    S.data.derniereSauvegarde = Date.now(); enregistrer(); render(); closeSheet(); toast("Sauvegarde créée");
  }
}
async function exporterCSV() {
  const c = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lignes = [["Type","Date","Produit / Libellé","Quantité","Prix unitaire","Total","Coût","Bénéfice","Paiement","Client","Téléphone","Encaissé","Catégorie"]];
  for (const v of [...S.data.ventes].sort((a, b) => a.date.localeCompare(b.date)))
    lignes.push(["Vente", v.date, nomProduit(v.produitId), v.qte, v.prix, totalVente(v), (+v.qte||0) * (+v.coutU||0), beneficeVente(v), v.paiement, v.client, v.tel, v.encaisse ? "oui" : "non", ""]);
  for (const d of [...S.data.depenses].sort((a, b) => a.date.localeCompare(b.date)))
    lignes.push(["Dépense", d.date, d.libelle, "", "", -(+d.montant||0), "", -(+d.montant||0), "", "", "", "", d.categorie]);
  const csv = "﻿" + lignes.map(l => l.map(c).join(";")).join("\r\n");
  if (await partagerFichier("cahier-de-caisse-" + todayISO() + ".csv", csv, "text/csv", "Export Cahier de Caisse")) { closeSheet(); toast("Export créé"); }
}

      <div><b>${d.produits.length}</b> produits · <b>${d.ventes.length}</b> ventes · <b>${d.depenses.length}</b> dépenses</div></div>
    <p class="note">Les données actuelles de cet appareil (${S.data.ventes.length} ventes, ${S.data.depenses.length} dépenses) seront remplacées.</p>
    <div class="btns"><button class="btn sec" data-close>Annuler</button><button class="btn warn" id="confirm-import">Remplacer</button></div>
  </div>`);
  $("#confirm-import").addEventListener("click", () => {
    S.data = normaliser({ format: d.format || 1, cree: d.cree || Date.now(), modifie: Date.now(), derniereSauvegarde: d.derniereSauvegarde || Date.now(),
      reglages: d.reglages, produits: d.produits, ventes: d.ventes, depenses: d.depenses });
    enregistrer(); closeSheet(); render(); toast("Données restaurées");
  });
});

/* ================= Événements ================= */
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.tab = b.dataset.tab; garderPrefs(); render(); window.scrollTo(0, 0); });
$("#fab").addEventListener("click", () => S.tab === "depenses" ? depenseForm() : S.tab === "stock" ? produitForm() : venteForm());
$("#btn-reglages").addEventListener("click", reglagesSheet);
document.addEventListener("input", e => {
  if (e.target.id === "q-ventes" || e.target.id === "q-clients") {
    const id = e.target.id, pos = e.target.selectionStart;
    if (id === "q-ventes") { S.q = e.target.value; renderVentes(); } else { S.qc = e.target.value; renderClients(); }
    const el = document.getElementById(id); el.focus(); try { el.setSelectionRange(pos, pos); } catch {}
  }
});
document.addEventListener("click", e => {
  const per = e.target.closest("[data-periode]");
  if (per) { S.periode = per.dataset.periode; garderPrefs(); render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "exporter") return exporter();
  if (act === "csv") return exporterCSV();
  if (act === "importer") return $("#import-file").click();
  if (act === "reglages") return reglagesSheet();
  if (act === "copier") {
    const p = produitDe(id); if (!p) return;
    navigator.clipboard.writeText(p.lien).then(() => toast("Lien copié"), () => toast("Copie impossible : " + p.lien));
    return;
  }
  if (act === "toggle") { const v = S.data.ventes.find(x => x.id === id); if (v) db.modifier("ventes", id, { encaisse: !v.encaisse }); return; }
  if (act === "edit") return produitForm(produitDe(id));
  if (act === "restock") return restockForm(produitDe(id));
  if (act === "edit-vente") return venteForm(S.data.ventes.find(x => x.id === id));
  if (act === "edit-dep") return depenseForm(S.data.depenses.find(x => x.id === id));
  if (act === "del") {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Supprimer"; } }, 3500); return; }
    db.supprimer(b.dataset.col, id); toast("Supprimé");
  }
});

render();

/* Hors connexion : le service worker garde l'appli en mémoire après la première ouverture */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
