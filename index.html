<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cahier de Caisse</title>
<meta name="theme-color" content="#0d6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Carnet de caisse mobile : bilan par période en tête, cinq onglets, bouton d'ajout flottant. Polices système pour marcher hors connexion. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#dbe2dd;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --gold:#a86a00; --gold-soft:#fbefd4; --red:#b3392f; --red-soft:#f8e1de;
  --violet:#5b4bb7; --violet-soft:#e8e5f7;
  --gain-bg:#0d6b57; --gain-ink:#ffffff; --loss-bg:#b3392f; --loss-ink:#ffffff; --zero-bg:#5d6b66; --zero-ink:#ffffff;
  --bar:#0d6b57; --bar-hi:#0a4f41; --grid:#e4e9e5; --tint:#eef2ef;
  --display:ui-rounded, "SF Pro Rounded", "Segoe UI", Roboto, system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1513; --surface:#18211e; --ink:#e6eeea; --muted:#9aaba4; --line:#2a3632;
  --accent:#3fbf9f; --accent-ink:#06231c; --accent-soft:#163a31;
  --gold:#f0b54a; --gold-soft:#3a2c10; --red:#ef8a7f; --red-soft:#3d1c18;
  --violet:#a99cf0; --violet-soft:#26213f;
  --gain-bg:#14765f; --gain-ink:#ffffff; --loss-bg:#a5352c; --loss-ink:#ffffff; --zero-bg:#2a3632; --zero-ink:#e6eeea;
  --bar:#3fbf9f; --bar-hi:#7fdcc4; --grid:#24302c; --tint:#141c19; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{padding-block:18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.01em;min-width:0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;padding-block:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.banner{padding:10px 12px;border-radius:10px;background:var(--gold-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.red{background:var(--red-soft)}
section{padding-top:16px;display:grid;gap:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.hero{background:var(--gain-bg);color:var(--gain-ink);border-radius:18px;padding:18px}
.hero.perte{background:var(--loss-bg);color:var(--loss-ink)}
.hero.zero{background:var(--zero-bg);color:var(--zero-ink)}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin-top:4px}
.hero .verdict{font-family:var(--display);font-weight:700;font-size:19px;margin-top:6px;text-wrap:balance}
.hero .explique{font-size:14px;opacity:.9;margin-top:2px}
.ledger{margin-top:14px;display:grid;gap:6px;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger .tot{border-top:1px solid currentColor;padding-top:6px;font-weight:700}
.ledger span:last-child{white-space:nowrap}
.ledger div:not(.tot){opacity:.9}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card.link{cursor:pointer}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
button.chip{width:100%}
.chip .v{font-weight:700;font-size:20px;margin-top:2px}
.chip.gold{background:var(--gold-soft);border-color:transparent}
.chip.gold .v{color:var(--gold)}

.prod .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prod h3{font-size:18px;font-weight:600;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.violet{background:var(--violet-soft);color:var(--violet)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.kv b{display:block;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.rank{font-size:12px;font-weight:700;color:var(--muted)}

/* Stock regroupé : catégorie > produit > variantes */
.total-stock{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;display:grid;gap:4px}
.total-stock .label{color:inherit;opacity:.75}
.total-stock .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.total-stock .note{color:inherit;opacity:.8}
.cat{display:grid;gap:8px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 2px 0;flex-wrap:wrap}
.cat-head h2{font-size:19px}
.cat-head .v{font-weight:700}
.groupe{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.groupe .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.groupe .gh .t{font-weight:700;font-size:16px}
.groupe .row{background:var(--tint);border-color:transparent}
.groupe .row.open{border-color:var(--accent)}

.chart svg{display:block;width:100%;height:auto;touch-action:manipulation}
.chart .tip{font-size:14px;min-height:21px}
.chart .tip b{font-weight:700}

.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:right}
.row .amt .m{font-weight:400}
.row .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.row.compact{cursor:pointer}
/* Fluidité : le navigateur ne dessine pas les lignes hors de l'écran */
#v-ventes>.row,#v-depenses>.row,.cat>.row,.groupe>.row{content-visibility:auto;contain-intrinsic-size:auto 76px}
.row.compact:not(.open) .acts{display:none}
.row.compact.open{border-color:var(--accent)}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none;display:inline-block}
.mini.danger{color:var(--red)}
.mini.wa{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.mini.armed{background:var(--red);color:var(--surface);border-color:var(--red)}
.paid{border:0;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.paid.yes{background:var(--accent-soft);color:var(--accent)}
.paid.no{background:var(--gold-soft);color:var(--gold)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.dayhead{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-size:16px}

/* Relevé vendeur */
.releve{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.releve .l{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.releve .l:first-child{border-top:0}
.releve .l .d{font-size:12px;color:var(--muted)}
.releve .l .s{color:var(--muted);font-size:13px;text-align:right;min-width:72px}
.releve .l.vers{background:var(--accent-soft)}
.plus{color:var(--gold)} .moins{color:var(--accent)}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;
  border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;padding:15px 22px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
.sheet form,.sheet .inner{max-width:600px;margin:0 auto;display:grid;gap:12px}
.sheet h2{font-size:22px}
.sheet h3{font-size:16px;margin-top:6px}
.sheet p{margin:0}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.calc{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);border:1px solid var(--line)}
.btn.warn{background:var(--red);color:var(--surface)}
.err{color:var(--red);font-size:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.sep{border:0;border-top:1px solid var(--line);margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* Photos, aperçus d'images, verrou PIN */
.photo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-pick img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.vignette{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.row .avec-vignette{display:flex;gap:10px;align-items:center;min-width:0}
.galerie-edit{display:flex;gap:10px;flex-wrap:wrap}
.g-photo{position:relative;width:82px;height:82px}
.g-photo img{width:82px;height:82px;object-fit:cover;border-radius:12px;border:2px solid var(--line);cursor:pointer;display:block}
.g-photo.principale img{border-color:var(--accent)}
.g-tag{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.g-x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1;padding:0}
.g-plus{width:82px;height:82px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.nuancier{display:flex;gap:12px;flex-wrap:wrap}
.nuancier label{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
.nuancier input{position:absolute;opacity:0;pointer-events:none}
.nuancier span{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.nuancier input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.nuancier input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;resize:vertical}
.apercus{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.apercus img{width:100%;border-radius:10px;border:1px solid var(--line)}
.outils{display:flex;gap:8px;flex-wrap:wrap}
.outils .mini{padding:8px 13px;font-size:14px;background:var(--surface)}
#verrou,#connexion{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#verrou .v-in,#connexion .v-in{display:grid;gap:18px;justify-items:center;width:100%;max-width:320px;text-align:center}
#verrou h2,#connexion h2{font-size:24px}
#connexion{overflow:auto}
textarea{color:inherit}
.v-points{display:flex;gap:14px}
.v-points i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.v-points i.on{background:var(--ink)}
.v-points.faux i{border-color:var(--red);background:var(--red)}
.v-pave{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.v-pave button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:600}
.v-oubli{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}
@media (prefers-reduced-motion:no-preference){.v-points.faux{animation:secoue .3s}@keyframes secoue{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.row.client{cursor:pointer}
.row.client:hover{border-color:var(--accent)}
.card.dodo{border-left:4px solid var(--gold)}
.card.dodo .row,.inner>.row{margin-top:8px}
#v-ventes>.row.client{content-visibility:visible}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="min-width:0"><h1>Cahier de Caisse</h1><p id="etat-synchro" class="note" hidden style="margin:2px 0 0"></p></div>
    <button class="pill" id="btn-reglages">Réglages</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="bilan" aria-selected="true">Bilan</button>
    <button role="tab" data-tab="ventes" aria-selected="false">Ventes</button>
    <button role="tab" data-tab="stock" aria-selected="false">Stock</button>
    <button role="tab" data-tab="vendeurs" aria-selected="false">Vendeurs</button>
    <button role="tab" data-tab="depenses" aria-selected="false">Dépenses</button>
  </nav>
  <section id="v-bilan"></section>
  <section id="v-ventes" hidden></section>
  <section id="v-stock" hidden></section>
  <section id="v-vendeurs" hidden></section>
  <section id="v-depenses" hidden></section>
</div>

<button class="fab" id="fab">+ Vente</button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="core.js"></script>
<script src="vues.js"></script>
<script src="formulaires.js"></script>
<script src="outils.js"></script>
<script src="catalogue.js"></script>
<script src="suivi.js"></script>
<script src="vitrine.js"></script>
<script src="config.js"></script>
<script src="synchro.js"></script>
<script src="main.js"></script>

</body>
</html>
